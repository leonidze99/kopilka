name: kopilka

services:
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: kopilka
      POSTGRES_PASSWORD: kopilka
      POSTGRES_DB: kopilka
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kopilka"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
