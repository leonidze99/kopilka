name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes a running workflow obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only need to read the repository.
permissions:
  contents: read

env:
  # Test-only values, not secrets. The API validates its config on startup,
  # and both e2e tests and OpenAPI generation boot the app.
  DATABASE_URL: postgresql://kopilka:kopilka@localhost:5432/kopilka
  JWT_ACCESS_SECRET: ci-only-jwt-secret-of-at-least-32-characters
  # Cypress is a dependency of the web app, but its ~250 MB browser binary
  # is only needed by the job that runs it (which installs it itself).
  CYPRESS_INSTALL_BINARY: '0'

# Third-party code runs with access to the repository, so actions are pinned
# to a commit SHA: a tag can be moved to a different commit, a SHA cannot.
# Dependabot (.github/dependabot.yml) keeps the pins up to date.

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Builds packages/shared first: api and web import its dist.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Generated API files are up to date
        run: |
          pnpm api:generate
          if ! git diff --exit-code -- apps/api/openapi.json apps/web/src/shared/api/schema.d.ts; then
            echo "::error::OpenAPI document or frontend API types are stale. Run 'pnpm api:generate' and commit the result."
            exit 1
          fi

  e2e:
    name: E2E tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The tests bring their own database (Testcontainers starts one and
    # throws it away). This service is for the two migration checks below,
    # which need a server to apply a migration to.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kopilka
          POSTGRES_PASSWORD: kopilka
          POSTGRES_DB: kopilka
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kopilka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @kopilka/shared build

      # The same command a deploy runs: applies committed migrations only.
      - name: Apply migrations
        run: pnpm --filter api db:deploy

      # Catches schema.prisma edited without a migration (exit code 2).
      - name: Migrations match schema.prisma
        run: pnpm --filter api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      # Starts postgres:16-alpine through Testcontainers, migrates it and
      # drops it afterwards; nothing is left between runs.
      - name: E2E tests
        run: pnpm --filter api test:e2e

  cypress:
    name: Browser tests (Cypress)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kopilka
          POSTGRES_PASSWORD: kopilka
          POSTGRES_DB: kopilka
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kopilka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache the Cypress binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install the Cypress binary
        env:
          CYPRESS_INSTALL_BINARY: ''
        run: pnpm --filter web exec cypress install

      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm --filter api db:deploy

      # One process serves the API and the built web app, as in production:
      # the refresh cookie (SameSite=Strict, Path=/api/auth) needs one origin.
      - name: Start the app
        env:
          WEB_DIST_DIR: apps/web/dist
          # No recurring payments or import workers while the browser drives.
          JOBS_ENABLED: 'false'
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS localhost:3000/api/health/ready && break
            sleep 2
          done
          curl -fsS localhost:3000/api/health/ready

      - name: Cypress
        env:
          CYPRESS_BASE_URL: http://localhost:3000
        run: pnpm --filter web e2e

      - name: Screenshots of the failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cypress-screenshots
          path: apps/web/cypress/screenshots
          if-no-files-found: ignore

      - name: App logs
        if: failure()
        run: cat /tmp/api.log

  image:
    name: Docker image (build, migrate, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kopilka
          POSTGRES_PASSWORD: kopilka
          POSTGRES_DB: kopilka
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kopilka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The second build reuses the stages of the first from the local cache.
      - name: Build images
        run: |
          docker build --target migrate -t kopilka-migrate .
          docker build -t kopilka .

      # The release flow on an empty database: migrate, then start.
      - name: Migrate
        run: docker run --rm --network host -e DATABASE_URL kopilka-migrate

      - name: Start the app
        run: docker run -d --name app --network host -e DATABASE_URL -e JWT_ACCESS_SECRET kopilka

      - name: Smoke test
        run: |
          for _ in $(seq 1 30); do
            curl -fsS localhost:3000/api/health/ready && break
            sleep 2
          done
          curl -fsS localhost:3000/api/health/ready
          # The web app comes from the same origin, client routes included.
          curl -fsS -H 'Accept: text/html' localhost:3000/categories | grep -q '<div id="root">'

      - name: App logs
        if: failure()
        run: docker logs app
